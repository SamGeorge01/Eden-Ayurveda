<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3325" />
      <stop offset="70%" stop-color="#142319" />
      <stop offset="100%" stop-color="#0c1610" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf3e8" />
      <stop offset="35%" stop-color="#c2d9bb" />
      <stop offset="70%" stop-color="#a8c5a0" />
      <stop offset="100%" stop-color="#6e9e74" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5aaa72" />
      <stop offset="50%" stop-color="#a8c5a0" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle with dark sanctuary styling -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner subtle decorative ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#a8c5a0" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Central Ayurvedic Leaf & Lotus Motif -->
  <g filter="url(#glow)">
    <!-- Left Lotus Leaf Petal -->
    <path d="M 256 370 C 220 350 145 310 145 225 C 145 160 215 140 256 255 C 256 255 240 190 200 160 C 150 120 110 170 110 230 C 110 320 200 375 256 390 Z" 
          fill="url(#goldGrad)" opacity="0.85" />

    <!-- Right Lotus Leaf Petal -->
    <path d="M 256 370 C 292 350 367 310 367 225 C 367 160 297 140 256 255 C 256 255 272 190 312 160 C 362 120 402 170 402 230 C 402 320 312 375 256 390 Z" 
          fill="url(#goldGrad)" opacity="0.85" />

    <!-- Central Sacred Leaf Body -->
    <path d="M 256 85 C 256 85 160 180 160 270 C 160 340 203 395 256 405 C 309 395 352 340 352 270 C 352 180 256 85 256 85 Z" 
          fill="url(#goldGrad)" />

    <!-- Inner Leaf Carving / Vein -->
    <path d="M 256 120 Q 256 260 256 385" 
          stroke="#142319" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Side Leaf Veins -->
    <path d="M 256 210 Q 220 240 195 270" stroke="#142319" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 256 210 Q 292 240 317 270" stroke="#142319" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 256 270 Q 225 295 205 325" stroke="#142319" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 256 270 Q 287 295 307 325" stroke="#142319" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Top Radiant Healing Droplet -->
    <circle cx="256" cy="62" r="14" fill="url(#accentGrad)" />
    <circle cx="256" cy="62" r="7" fill="#ffffff" />
  </g>
</svg>
