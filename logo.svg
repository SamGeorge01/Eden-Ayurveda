<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="logoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b2e23" />
      <stop offset="70%" stop-color="#142319" />
      <stop offset="100%" stop-color="#0c1610" />
    </radialGradient>
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f7f0" />
      <stop offset="35%" stop-color="#c2d9bb" />
      <stop offset="70%" stop-color="#a8c5a0" />
      <stop offset="100%" stop-color="#6e9e74" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2d9bb" />
      <stop offset="50%" stop-color="#eef4ec" />
      <stop offset="100%" stop-color="#a8c5a0" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#logoBg)" rx="40" />

  <!-- Outer Decorative Border -->
  <rect x="20" y="20" width="760" height="760" rx="30" fill="none" stroke="#a8c5a0" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 8" />

  <!-- Central Brand Mark Group -->
  <g transform="translate(400, 310) scale(0.95)" filter="url(#logoGlow)">
    <!-- Base Circle -->
    <circle cx="0" cy="0" r="190" fill="#142319" stroke="url(#goldGradL)" stroke-width="10" />
    <circle cx="0" cy="0" r="175" fill="none" stroke="#a8c5a0" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6" />

    <!-- Left Lotus Leaf Petal -->
    <path d="M 0 90 C -28 75 -90 40 -90 -25 C -90 -75 -35 -90 0 0 C 0 0 -12 -50 -44 -75 C -84 -105 -116 -65 -116 -20 C -116 50 -45 95 0 105 Z" 
          fill="url(#goldGradL)" opacity="0.85" />

    <!-- Right Lotus Leaf Petal -->
    <path d="M 0 90 C 28 75 90 40 90 -25 C 90 -75 35 -90 0 0 C 0 0 12 -50 44 -75 C 84 -105 116 -65 116 -20 C 116 50 45 95 0 105 Z" 
          fill="url(#goldGradL)" opacity="0.85" />

    <!-- Central Sacred Leaf Body -->
    <path d="M 0 -135 C 0 -135 -75 -60 -75 10 C -75 65 -40 110 0 120 C 40 110 75 65 75 10 C 75 -60 0 -135 0 -135 Z" 
          fill="url(#goldGradL)" />

    <!-- Leaf Veins -->
    <path d="M 0 -105 Q 0 0 0 100" stroke="#142319" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 0 -35 Q -30 -10 -50 15" stroke="#142319" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 0 -35 Q 30 -10 50 15" stroke="#142319" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 0 15 Q -25 35 -40 60" stroke="#142319" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 0 15 Q 25 35 40 60" stroke="#142319" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Healing Droplet -->
    <circle cx="0" cy="-155" r="11" fill="#d4af37" />
    <circle cx="0" cy="-155" r="5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="400" y="590" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="52" font-weight="600" fill="url(#goldText)" letter-spacing="6">
    EDEN AYURVEDA
  </text>
  <text x="400" y="640" text-anchor="middle" font-family="'Outfit', -apple-system, sans-serif" font-size="20" font-weight="500" fill="#a8c5a0" letter-spacing="10">
    HOSPITAL
  </text>
  <text x="400" y="685" text-anchor="middle" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="300" fill="#7d9b80" letter-spacing="5">
    PALAKKAD · WALAYAR · ALAPUZHA · KERALA
  </text>
</svg>
